services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: court_booking
      POSTGRES_PASSWORD: court_booking
      POSTGRES_DB: court_booking
    ports: ['15432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U court_booking -d court_booking']
      interval: 5s
      timeout: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.21
    ports: ['1025:1025', '8025:8025']
volumes:
  postgres-data:
